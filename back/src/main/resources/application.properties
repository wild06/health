spring.application.name=back
server.port=8081

# MySQL datasource
spring.datasource.url=jdbc:mysql://localhost:3306/healthdata?useSSL=false&serverTimezone=UTC&useUnicode=true&characterEncoding=utf8
spring.datasource.username=root
spring.datasource.password=jingqi1210
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# MyBatis configuration
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.type-aliases-package=com.unity.back.entity
mybatis.mapper-locations=classpath*:mappers/*.xml

# CORS (we will also configure via WebMvcConfigurer)
# frontend origin example
app.cors.allowed-origins=http://localhost:8080

# Initialize schema on startup
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# Logging (optional)
logging.level.org.mybatis=INFO
logging.level.com.unity.back=DEBUG
